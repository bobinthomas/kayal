name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "onam26/**"
  pull_request:
    paths-ignore:
      - "onam26/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  # Lighthouse budget check (PRD §8.4): runs against the built static site.
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve and audit
        run: |
          npx -y serve out -l 8080 &
          sleep 3
          npx -y @lhci/cli@0.14.x autorun \
            --collect.url=http://localhost:8080/ \
            --collect.url=http://localhost:8080/menu/ \
            --collect.settings.preset=desktop \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:seo=error \
            --assert.assertions.categories:accessibility=error \
            --upload.target=temporary-public-storage || true
