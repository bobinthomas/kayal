name: CI (order)

on:
  push:
    branches: [main]
    paths:
      - "order/**"
      - ".github/workflows/ci-order.yml"
  pull_request:
    paths:
      - "order/**"
      - ".github/workflows/ci-order.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: order/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: order-site
          path: order/out
          retention-days: 7
